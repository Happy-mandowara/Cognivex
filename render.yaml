# Render Blueprint Specification for MediKiosk
# See: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Core Clinical Backend
  - type: web
    name: medikiosk-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: medikiosk-db
          property: connectionString
      - key: REDIS_URL
        value: "" # In-memory fallback
      - key: ABDM_GATEWAY_URL
        value: https://dev.abdm.gov.in/gateway
      - key: ABDM_CLIENT_ID
        value: MEDIKIOSK_SBX_01
      - key: ABDM_CLIENT_SECRET
        generateValue: true

  # 2. React + Vite Frontend (Static Site on Global CDN)
  - type: web
    name: medikiosk-frontend
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://medikiosk-backend-jfkm.onrender.com/api

databases:
  # 3. PostgreSQL 16 Managed Database
  - name: medikiosk-db
    databaseName: medikiosk
    user: medikiosk_user
    plan: free
    region: oregon
